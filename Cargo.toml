[package]
name = "GEMO"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"
wgpu = "29.0.0"
env_logger = "0.10"
pollster = "0.3"
log = "0.4"
anyhow = "1.0"

[lib]
# rlib - для запуска в настольной среде
# cdylib - для web assembly
crate-type = ["cdylib", "rlib"]

# Какие-то зависимости для wasm:
[profile.release]
strip = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "30.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}